<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCAT Brain</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050505;
  --panel:#151515;
  --panel2:#1b1b1b;
  --text:#f4f4f4;
  --muted:#929292;
  --bio:#62dc8b;
  --master:#8fe7ad;
  --dev:#e8c96f;
  --glow:rgba(98,220,139,.20);
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/* =========================
   MCAT ENTRANCE
========================= */

#entrance{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  transition:
    opacity .6s ease,
    transform .7s cubic-bezier(.16,.84,.22,1);
}

#entrance.hidden{
  opacity:0;
  pointer-events:none;
  transform:scale(1.22);
}

.enter-node{
  text-align:center;
  cursor:pointer;
  user-select:none;
  transition:
    transform .22s ease,
    text-shadow .22s ease;
}

.enter-node:hover{
  transform:scale(1.06);
  text-shadow:0 0 34px rgba(98,220,139,.25);
}

.enter-title{
  font-size:clamp(52px,8vw,94px);
  font-weight:820;
  letter-spacing:-.06em;
  line-height:.9;
}

.enter-sub{
  margin-top:13px;
  color:var(--bio);
  font-size:12px;
  font-weight:750;
  letter-spacing:.16em;
  text-transform:uppercase;
}

/* =========================
   APP
========================= */

#app{
  position:fixed;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .45s ease;
}

#app.visible{
  opacity:1;
  pointer-events:auto;
}

/* =========================
   TOP NAV
========================= */

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:0 28px;
  background:
    linear-gradient(
      to bottom,
      rgba(5,5,5,.98),
      rgba(5,5,5,.72),
      transparent
    );
}

.crumbs{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  color:#777;
  font-size:13px;
}

.crumb{
  color:#999;
  cursor:pointer;
}

.crumb:hover{
  color:#fff;
}

.crumb.current{
  color:var(--bio);
  font-weight:750;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  appearance:none;
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#ededed;
  color:#111;
  font:inherit;
  font-size:12px;
  font-weight:760;
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
}

.btn.secondary{
  background:#181818;
  color:#eee;
  border:1px solid #343434;
}

.btn.ghost{
  background:rgba(12,12,12,.72);
  color:#ccc;
  border:1px solid #303030;
}

.btn.home{
  color:var(--bio);
  border-color:rgba(98,220,139,.38);
}

/* =========================
   MAP
========================= */

.viewport{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(98,220,139,.045),
      transparent 34%
    ),
    #050505;
}

.world{
  position:absolute;
  inset:0;
  transform-origin:50% 50%;
  transition:
    transform .62s cubic-bezier(.16,.84,.22,1),
    opacity .3s ease;
}

/* =========================
   NODES
========================= */

.node{
  position:absolute;
  z-index:4;
  transform:translate(-50%,-50%);
  min-width:150px;
  max-width:225px;
  padding:12px 14px;
  border:1px solid #373737;
  border-radius:18px;
  background:rgba(22,22,22,.96);
  text-align:center;
  cursor:pointer;
  user-select:none;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .22s ease,
    background .2s ease;
}

.node:hover{
  transform:translate(-50%,-50%) scale(1.04);
  border-color:#696969;
  background:#1b1b1b;
}

.node.parent-node{
  min-width:190px;
  padding:15px 18px;
}

.node.focus-node{
  width:270px;
  max-width:270px;
  padding:16px 17px;
  border-color:var(--bio);
  background:#171917;
  box-shadow:
    0 0 0 1px rgba(98,220,139,.10),
    0 0 34px var(--glow);
  cursor:default;
}

.node.focus-node:hover{
  transform:translate(-50%,-50%);
}

.node-title{
  font-size:15px;
  font-weight:780;
  letter-spacing:-.025em;
  line-height:1.12;
}

.parent-node .node-title{
  font-size:18px;
}

.focus-node .node-title{
  font-size:19px;
}

.meta{
  margin-top:6px;
  color:#888;
  font-size:10px;
}

.source{
  color:var(--bio);
  font-weight:750;
}

.mastered{
  color:var(--master);
}

.developing{
  color:var(--dev);
}

/* =========================
   MERGED SCOPE
========================= */

.focus-description{
  margin-top:8px;
  color:#a9a9a9;
  font-size:11px;
  line-height:1.42;
}

.focus-actions{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:11px;
}

.focus-actions .btn{
  padding:7px 10px;
  font-size:10px;
}

/* =========================
   NEURAL CONNECTIONS
========================= */

.branch-svg{
  position:absolute;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
  overflow:visible;
}

.branch{
  fill:none;
  stroke:rgba(98,220,139,.68);
  stroke-width:3.5;
  stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(98,220,139,.13));
}

.branch.major{
  stroke-width:5;
  stroke:rgba(98,220,139,.82);
}

.branch-hit{
  fill:none;
  stroke:transparent;
  stroke-width:28;
  cursor:pointer;
}

/* =========================
   BRAIN NOTES — GROW OUTWARD
========================= */

.note-branch{
  position:absolute;
  z-index:5;
  transform:translate(-50%,-50%) scale(.86);
  opacity:0;
  width:210px;
  padding:12px 13px;
  border:1px solid rgba(98,220,139,.34);
  border-radius:15px;
  background:rgba(17,20,18,.97);
  box-shadow:0 0 22px rgba(98,220,139,.08);
  transition:
    transform .35s cubic-bezier(.16,.84,.22,1),
    opacity .28s ease;
}

.note-branch.visible{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.note-heading{
  margin-bottom:7px;
  color:var(--bio);
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.note-bullets{
  margin:0;
  padding-left:16px;
  color:#d1d1d1;
  font-size:11px;
  line-height:1.45;
}

.note-bullets li{
  margin:3px 0;
}

.pathway{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  color:#ddd;
  font-size:10.5px;
  line-height:1.35;
}

.path-step{
  padding:5px 7px;
  border:1px solid #303730;
  border-radius:8px;
  background:#181b18;
}

.arrow{
  color:var(--bio);
  font-weight:900;
}

/* =========================
   HELPER
========================= */

.helper{
  position:absolute;
  left:25px;
  bottom:22px;
  z-index:10;
  display:flex;
  align-items:center;
  gap:10px;
  max-width:300px;
  padding:10px 13px;
  border:1px solid #292929;
  border-radius:14px;
  background:rgba(12,12,12,.75);
  color:#969696;
  font-size:11px;
  line-height:1.4;
  backdrop-filter:blur(7px);
}

.helper-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  flex:0 0 28px;
  border:1px solid #333;
  border-radius:50%;
  color:#ddd;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .topbar{
    padding:0 12px;
  }

  .top-actions{
    gap:5px;
  }

  .top-actions .btn{
    padding:7px 8px;
    font-size:10px;
  }

  .focus-node{
    width:235px;
    max-width:235px;
  }

  .note-branch{
    width:175px;
  }

  .helper{
    left:12px;
    bottom:12px;
    max-width:235px;
  }

}
</style>
</head>

<body>

<!-- =========================
     ENTRANCE
========================= -->

<section id="entrance">

  <div
    class="enter-node"
    id="enterMCAT"
  >

    <div class="enter-title">
      MCAT
    </div>

    <div class="enter-sub">
      Enter
    </div>

  </div>

</section>

<!-- =========================
     MAIN APP
========================= -->

<main id="app">

  <header class="topbar">

    <div
      class="crumbs"
      id="crumbs"
    ></div>

    <div class="top-actions">

      <button
        class="btn ghost home"
        id="homeBtn"
      >
        Home
      </button>

      <button
        class="btn ghost"
        id="backBtn"
      >
        ← Zoom out
      </button>

      <a
        class="btn secondary"
        href="/lesson-reviews.html"
      >
        Lesson Reviews
      </a>

    </div>

  </header>

  <div
    class="viewport"
    id="viewport"
  >

    <div
      class="world"
      id="world"
    ></div>

    <div class="helper">

      <div class="helper-icon">
        ⌖
      </div>

      <div>
        Click a concept or branch to move deeper.
        Brain Notes grow outward from the focused concept.
      </div>

    </div>

  </div>

</main>

<script>

/* =========================
   DATA
========================= */
let data = {};

async function loadConceptMapData(){

  try{

    const response = await fetch(
      '/concept-map-data.json',
      {
        cache: 'no-store'
      }
    );

    if(!response.ok){

      throw new Error(
        `Concept map data failed to load: ${response.status}`
      );

    }

    data =  response.json();

  }
  catch(error){

    console.error(
      'Could not load Concept Map data:',
      error
    );

    throw error;
  }

}

/* =========================
   STATE
========================= */

let focus='living';
let notesOpen=false;

/* =========================
   ELEMENTS
========================= */

const entrance=
  document.getElementById('entrance');

const app=
  document.getElementById('app');

const world=
  document.getElementById('world');

const viewport=
  document.getElementById('viewport');

const crumbs=
  document.getElementById('crumbs');

/* =========================
   HELPERS
========================= */

function ancestors(key){

  const path=[];

  let current=key;

  while(current){

    path.unshift(current);

    current=data[current].parent;

  }

  return path;

}

function statusHTML(item){

  if(item.status==='mastered'){
    return '<span class="mastered">✓</span>';
  }

  if(item.status==='developing'){
    return '<span class="developing">◐</span>';
  }

  return '';

}

function nodeHTML(
  key,
  x,
  y,
  type='normal'
){

  const item=data[key];

  if(type==='focus'){

    return `
      <div
        class="node focus-node"
        data-key="${key}"
        style="
          left:${x}%;
          top:${y}%;
        "
      >

        <div class="node-title">
          ${item.title}
        </div>

        <div class="meta">
          ${
            item.source
            ? `<span class="source">
                 ● ${item.source}
               </span>`
            : ''
          }
          ${statusHTML(item)}
        </div>

        <div class="focus-description">
          ${item.desc}
        </div>

        <div class="focus-actions">

          <button
            class="btn review2-local"
          >
            Start Review2
          </button>

          <button
            class="btn secondary notes-local"
          >
            ${
              notesOpen
              ? 'Hide Notes'
              : 'Brain Notes'
            }
          </button>

        </div>

      </div>
    `;

  }

  return `
    <div
      class="
        node
        ${
          type==='parent'
          ? 'parent-node'
          : ''
        }
      "
      data-key="${key}"
      style="
        left:${x}%;
        top:${y}%;
      "
    >

      <div class="node-title">
        ${item.title}
      </div>

      <div class="meta">

        ${
          item.source
          ? `<span class="source">
               ● ${item.source}
             </span>`
          : ''
        }

        ${statusHTML(item)}

      </div>

    </div>
  `;

}

function pathBetween(
  x1,
  y1,
  x2,
  y2,
  bend=0
){

  const width=
    viewport.clientWidth;

  const height=
    viewport.clientHeight;

  const ax=
    x1/100*width;

  const ay=
    y1/100*height;

  const bx=
    x2/100*width;

  const by=
    y2/100*height;

  const midpoint=
    (ay+by)/2;

  return `
    M ${ax} ${ay}
    C ${ax+bend} ${midpoint},
      ${bx-bend} ${midpoint},
      ${bx} ${by}
  `;

}

function svgHTML(paths){

  return `
    <svg class="branch-svg">

      ${
        paths.map(
          path=>`

            <g
              class="branch-group"
              ${
                path.key
                ? `data-key="${path.key}"`
                : ''
              }
            >

              <path
                class="
                  branch
                  ${path.major?'major':''}
                "
                d="${path.d}"
              ></path>

              ${
                path.key
                ? `
                  <path
                    class="branch-hit"
                    d="${path.d}"
                  ></path>
                `
                : ''
              }

            </g>

          `
        ).join('')
      }

    </svg>
  `;

}

/* =========================
   NOTE BRANCHES
========================= */

function noteHTML(note,x,y,index){

  if(note.type==='path'){

    return `
      <div
        class="note-branch"
        data-note-index="${index}"
        style="
          left:${x}%;
          top:${y}%;
        "
      >

        <div class="note-heading">
          ${note.title}
        </div>

        <div class="pathway">

          ${
            note.steps
              .map(
                (step,i)=>`

                  <span class="path-step">
                    ${step}
                  </span>

                  ${
                    i<
                    note.steps.length-1
                    ? '<span class="arrow">→</span>'
                    : ''
                  }

                `
              )
              .join('')
          }

        </div>

      </div>
    `;

  }

  return `
    <div
      class="note-branch"
      data-note-index="${index}"
      style="
        left:${x}%;
        top:${y}%;
      "
    >

      <div class="note-heading">
        ${note.title}
      </div>

      <ul class="note-bullets">

        ${
          note.items
            .map(
              item=>`
                <li>${item}</li>
              `
            )
            .join('')
        }

      </ul>

    </div>
  `;

}

function notePositions(count){

  const sets={

    1:[
      [78,47]
    ],

    2:[
      [76,35],
      [77,62]
    ],

    3:[
      [74,28],
      [81,50],
      [73,72]
    ],

    4:[
      [72,25],
      [82,42],
      [82,64],
      [70,80]
    ],

    5:[
      [69,22],
      [82,35],
      [85,54],
      [79,72],
      [65,84]
    ]

  };

  if(sets[count]){
    return sets[count];
  }

  const result=[];

  for(let i=0;i<count;i++){

    result.push([
      72+
      (
        i%2===0
        ? 7
        : -4
      ),
      18+
      (
        68*
        (
          i/
          Math.max(
            1,
            count-1
          )
        )
      )
    ]);

  }

  return result;

}

/* =========================
   RENDER
========================= */

function render(){

  const current=
    data[focus];

  const parent=
    current.parent;

  const children=
    current.children;

  let html='';
  let paths=[];

  const focusX=
    notesOpen
    ? 42
    : 50;

  const focusY=
    42;

  if(parent && focus !== 'living'){

    html+=nodeHTML(
      parent,
      focusX,
      16,
      'parent'
    );

    paths.push({

      key:focus,

      major:true,

      d:pathBetween(
        focusX,
        21,
        focusX,
        34,
        0
      )

    });

  }

  html+=nodeHTML(
    focus,
    focusX,
    focusY,
    'focus'
  );

  const childPositions=
    getChildPositions(
      children.length,
      notesOpen
    );

  children.forEach(
    (child,index)=>{

      const [
        x,
        y
      ]=
        childPositions[index];

      paths.push({

        key:child,

        d:pathBetween(
          focusX,
          50,
          x,
          y-6,
          (
            x-
            focusX
          )*
          2.5
        )

      });

      html+=nodeHTML(
        child,
        x,
        y
      );

    }
  );

  if(notesOpen){

    const notes=
      current.notes||[];

    const positions=
      notePositions(
        notes.length
      );

    notes.forEach(
      (note,index)=>{

        const [
          x,
          y
        ]=
          positions[index];

        paths.push({

          key:null,

          d:pathBetween(
            focusX+8,
            focusY,
            x-8,
            y,
            70+
            index*10
          )

        });

        html+=noteHTML(
          note,
          x,
          y,
          index
        );

      }
    );

  }

  world.innerHTML=
    svgHTML(paths)+
    html;

  bindMapEvents();

  updateBreadcrumbs();

  world.style.transform=
    'scale(.96)';

  requestAnimationFrame(
    ()=>{

      requestAnimationFrame(
        ()=>{

          world.style.transform=
            'scale(1)';

          if(notesOpen){

            world
              .querySelectorAll(
                '.note-branch'
              )
              .forEach(
                (
                  note,
                  index
                )=>{

                  setTimeout(
                    ()=>{
                      note
                        .classList
                        .add(
                          'visible'
                        );
                    },
                    60+
                    index*60
                  );

                }
              );

          }

        }
      );

    }
  );

}

function getChildPositions(
  count,
  compressed
){

  if(count===0){
    return [];
  }

  const rightLimit=
    compressed
    ? 58
    : 87;

  const leftLimit=
    13;

  if(count===1){

    return [
      [
        (
          leftLimit+
          rightLimit
        )/
        2,
        76
      ]
    ];

  }

  if(count===2){

    return [
      [27,76],
      [compressed?56:73,76]
    ];

  }

  if(count===3){

    return [
      [18,75],
      [40,81],
      [compressed?59:78,74]
    ];

  }

  if(count<=5){

    const positions=[];

    for(let i=0;i<count;i++){

      positions.push([
        leftLimit+
        (
          (
            rightLimit-
            leftLimit
          )*
          (
            i/
            (
              count-1
            )
          )
        ),
        i%2===0
        ? 74
        : 82
      ]);

    }

    return positions;

  }

  const positions=[];

  const first=
    Math.ceil(
      count/2
    );

  const row1=
    count-
    first;

  for(let i=0;i<first;i++){

    positions.push([
      12+
      (
        (
          rightLimit-
          12
        )*
        (
          i/
          Math.max(
            1,
            first-1
          )
        )
      ),
      69
    ]);

  }

  for(let i=0;i<row1;i++){

    positions.push([
      19+
      (
        (
          rightLimit-
          24
        )*
        (
          i/
          Math.max(
            1,
            row1-1
          )
        )
      ),
      86
    ]);

  }

  return positions;

}

/* =========================
   EVENTS
========================= */

function bindMapEvents(){

  world
    .querySelectorAll(
      '.node:not(.focus-node)'
    )
    .forEach(
      node=>{

        node.addEventListener(
          'click',
          ()=>{

            zoomTo(
              node.dataset.key
            );

          }
        );

      }
    );

  world
    .querySelectorAll(
      '.branch-group[data-key]'
    )
    .forEach(
      branch=>{

        branch.addEventListener(
          'click',
          ()=>{

            zoomTo(
              branch.dataset.key
            );

          }
        );

      }
    );

  const reviewButton=
    world.querySelector(
      '.review2-local'
    );

  if(reviewButton){

    reviewButton
      .addEventListener(
        'click',
        event=>{

          event.stopPropagation();

          const path=
            ancestors(focus)
              .map(
                key=>
                  data[key].title
              )
              .join(' → ');

          alert(
            `Review2 will eventually launch using:

${path}

Not wired yet.`
          );

        }
      );

  }

  const notesButton=
    world.querySelector(
      '.notes-local'
    );

  if(notesButton){

    notesButton
      .addEventListener(
        'click',
        event=>{

          event.stopPropagation();

          notesOpen=
            !notesOpen;

          render();

        }
      );

  }

}

function zoomTo(key){

  if(!data[key]){
    return;
  }

  focus=key;

  notesOpen=false;

  render();

}

/* =========================
   BREADCRUMBS
========================= */

function updateBreadcrumbs(){

  const path=
    ancestors(focus);

  crumbs.innerHTML=
    path
      .map(
        (
          key,
          index
        )=>`

          <span
            class="
              crumb
              ${
                index===
                path.length-1
                ? 'current'
                : ''
              }
            "
            data-key="${key}"
          >
            ${data[key].title}
          </span>

          ${
            index<
            path.length-1
            ? '<span>›</span>'
            : ''
          }

        `
      )
      .join('');

  crumbs
    .querySelectorAll(
      '.crumb'
    )
    .forEach(
      crumb=>{

        crumb.addEventListener(
  'click',
  ()=>{

    if(crumb.dataset.key === 'mcat'){

      goHome();

      return;
    }

    zoomTo(
      crumb.dataset.key
    );

  }
);

      }
    );

  const back=
    document.getElementById(
      'backBtn'
    );

  back.disabled=
    !data[focus].parent;

  back.style.opacity=
    data[focus].parent
    ? '1'
    : '.35';

}

/* =========================
   APP CONTROLS
========================= */

function enterMap(){

  entrance
    .classList
    .add('hidden');

  app
    .classList
    .add('visible');

  focus='living';

  notesOpen=false;

  render();

}

function goHome(){

  notesOpen=false;

  app
    .classList
    .remove('visible');

  entrance
    .classList
    .remove('hidden');

}

document
  .getElementById(
    'enterMCAT'
  )
  .addEventListener(
    'click',
    enterMap
  );

document
  .getElementById(
    'homeBtn'
  )
  .addEventListener(
    'click',
    goHome
  );

document
  .getElementById(
    'backBtn'
  )
  .addEventListener(
    'click',
    ()=>{

      const parent=
        data[focus].parent;

      if(!parent){
        return;
      }

      if(parent === 'mcat'){

        goHome();

        return;
      }

      zoomTo(
        parent
      );

    }
  );

window
  .addEventListener(
    'resize',
    ()=>{

      if(
        app
          .classList
          .contains(
            'visible'
          )
      ){

        render();

      }

    }
  );
loadConceptMapData()
  .then(()=>{
    console.log('Concept Map data loaded');
  })
  .catch(error=>{
    console.error(
      'Concept Map failed to initialize:',
      error
    );
  });
</script>
