    }

      border-radius: 999px;
      background: #171717;
      color: #ededed;
      font-size: 13px;
      font-weight: 700;

        border-color 0.15s ease,
        background 0.15s ease,
        transform 0.15s ease;
    }

    .secondary-btn:hover {
      border-color: #4a4a4a;
      background: #202020;
      transform: translateY(-1px);
    }

      background: #131313;
